<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Superpowers — Workflow có kỷ luật cho AI coding agent</title>
  <desc id="desc">Sơ đồ workflow từ brainstorming qua planning, TDD, review, verification đến ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.58" stop-color="#101827"/>
      <stop offset="1" stop-color="#1b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="250" fill="#f59e0b" opacity=".08"/>
  <circle cx="100" cy="600" r="290" fill="#7c3aed" opacity=".08"/>

  <g transform="translate(64 70)">
    <text x="0" y="0" fill="#78879a" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">CUONG VUONG · DEVELOPER BLOG</text>

    <g transform="translate(0 55)">
      <path d="M22 0 L0 42 H22 L10 78 L62 25 H36 L52 0 Z" fill="url(#accent)" filter="url(#glow)"/>
      <text x="82" y="58" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="72" font-weight="850" letter-spacing="-3">Superpowers</text>
    </g>

    <text x="0" y="170" fill="#d5dce6" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="650">Workflow có kỷ luật cho AI coding agent</text>
    <text x="0" y="207" fill="#8798ad" font-family="Inter,Segoe UI,sans-serif" font-size="17">Design trước code · TDD · review · evidence trước khi nói done</text>

    <g transform="translate(0 270)">
      <rect width="455" height="225" rx="20" fill="#0b121d" stroke="#27364a"/>
      <text x="28" y="40" fill="#f7b955" font-family="JetBrains Mono,monospace" font-size="15">obra/superpowers</text>
      <text x="28" y="79" fill="#a6b3c4" font-family="JetBrains Mono,monospace" font-size="15">skills/</text>
      <text x="50" y="108" fill="#dce4ee" font-family="JetBrains Mono,monospace" font-size="15">├── brainstorming</text>
      <text x="50" y="137" fill="#dce4ee" font-family="JetBrains Mono,monospace" font-size="15">├── writing-plans</text>
      <text x="50" y="166" fill="#dce4ee" font-family="JetBrains Mono,monospace" font-size="15">├── test-driven-development</text>
      <text x="50" y="195" fill="#dce4ee" font-family="JetBrains Mono,monospace" font-size="15">└── verification-before-completion</text>
    </g>

    <g transform="translate(0 525)">
      <rect width="103" height="31" rx="15.5" fill="#21170a" stroke="#9b6714"/>
      <text x="51.5" y="20.5" text-anchor="middle" fill="#f6bb59" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">v6.4.1</text>
      <rect x="116" width="125" height="31" rx="15.5" fill="#101922" stroke="#33465d"/>
      <text x="178.5" y="20.5" text-anchor="middle" fill="#aab7c8" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">MIT LICENSE</text>
      <rect x="254" width="175" height="31" rx="15.5" fill="#101922" stroke="#33465d"/>
      <text x="341.5" y="20.5" text-anchor="middle" fill="#aab7c8" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">MULTI-HARNESS</text>
    </g>
  </g>

  <g transform="translate(575 86)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="560" height="448" rx="24" fill="#09111c" stroke="#2a3b50" stroke-width="2"/>
    <text x="30" y="46" fill="#f4f7fb" font-size="21" font-weight="750">Development workflow</text>
    <text x="30" y="72" fill="#708198" font-size="14">skills trigger automatically when the task needs them</text>

    <g transform="translate(30 100)">
      <g>
        <rect width="235" height="64" rx="13" fill="#121c29" stroke="#8c5a15"/>
        <circle cx="32" cy="32" r="17" fill="#30200b"/>
        <text x="32" y="38" text-anchor="middle" fill="#f6ad36" font-size="18">?</text>
        <text x="61" y="28" fill="#ffffff" font-size="18" font-weight="700">brainstorm</text>
        <text x="61" y="48" fill="#8495aa" font-size="12">intent + design + approval</text>
      </g>

      <g transform="translate(265 0)">
        <rect width="235" height="64" rx="13" fill="#121c29" stroke="#4d5d73"/>
        <circle cx="32" cy="32" r="17" fill="#1c2938"/>
        <text x="32" y="38" text-anchor="middle" fill="#9fb2c8" font-size="18">≡</text>
        <text x="61" y="28" fill="#ffffff" font-size="18" font-weight="700">plan</text>
        <text x="61" y="48" fill="#8495aa" font-size="12">tasks + files + tests</text>
      </g>

      <path d="M235 32 H265" stroke="#f59e0b" stroke-width="2"/>
      <path d="M259 26 L266 32 L259 38" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <path d="M382 69 V94" stroke="#f59e0b" stroke-width="2"/>
      <path d="M376 88 L382 95 L388 88" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <g transform="translate(265 100)">
        <rect width="235" height="64" rx="13" fill="#121c29" stroke="#4d5d73"/>
        <circle cx="32" cy="32" r="17" fill="#1c2938"/>
        <text x="32" y="38" text-anchor="middle" fill="#9fb2c8" font-size="16">&lt;/&gt;</text>
        <text x="61" y="28" fill="#ffffff" font-size="18" font-weight="700">TDD + build</text>
        <text x="61" y="48" fill="#8495aa" font-size="12">red → green → refactor</text>
      </g>

      <g transform="translate(0 100)">
        <rect width="235" height="64" rx="13" fill="#121c29" stroke="#4d5d73"/>
        <circle cx="32" cy="32" r="17" fill="#1c2938"/>
        <text x="32" y="38" text-anchor="middle" fill="#9fb2c8" font-size="17">⑂</text>
        <text x="61" y="28" fill="#ffffff" font-size="18" font-weight="700">worktree</text>
        <text x="61" y="48" fill="#8495aa" font-size="12">isolated workspace</text>
      </g>

      <path d="M265 132 H235" stroke="#f59e0b" stroke-width="2"/>
      <path d="M241 126 L234 132 L241 138" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <path d="M117 169 V194" stroke="#f59e0b" stroke-width="2"/>
      <path d="M111 188 L117 195 L123 188" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <g transform="translate(0 200)">
        <rect width="235" height="64" rx="13" fill="#121c29" stroke="#4d5d73"/>
        <circle cx="32" cy="32" r="17" fill="#1c2938"/>
        <text x="32" y="38" text-anchor="middle" fill="#9fb2c8" font-size="18">✓</text>
        <text x="61" y="28" fill="#ffffff" font-size="18" font-weight="700">review</text>
        <text x="61" y="48" fill="#8495aa" font-size="12">spec + code quality</text>
      </g>

      <g transform="translate(265 200)">
        <rect width="235" height="64" rx="13" fill="#151d20" stroke="#2ca879"/>
        <circle cx="32" cy="32" r="17" fill="#123326"/>
        <text x="32" y="38" text-anchor="middle" fill="#69e6b2" font-size="18">✓</text>
        <text x="61" y="28" fill="#ffffff" font-size="18" font-weight="700">verify</text>
        <text x="61" y="48" fill="#78a894" font-size="12">fresh evidence only</text>
      </g>

      <path d="M235 232 H265" stroke="#f59e0b" stroke-width="2"/>
      <path d="M259 226 L266 232 L259 238" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <path d="M382 269 V294" stroke="#f59e0b" stroke-width="2"/>
      <path d="M376 288 L382 295 L388 288" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <rect x="0" y="300" width="500" height="62" rx="15" fill="#2d1a07" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
      <text x="250" y="338" text-anchor="middle" fill="#ffd27a" font-size="20" font-weight="800">MERGE / PR / SHIP</text>
    </g>
  </g>

  <text x="1135" y="590" text-anchor="end" fill="#65758a" font-family="Inter,Segoe UI,sans-serif" font-size="14">22 · 09 · 2026</text>
</svg>