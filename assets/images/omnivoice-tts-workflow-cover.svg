        <text x="99" y="21" text-anchor="middle" fill="#c8bfff" font-size="11">M</text>
        <text x="141" y="21" text-anchor="middle" fill="#88f4ea" font-size="11">B</text>
        <text x="183" y="21" text-anchor="middle" fill="#c8bfff" font-size="11">M</text>
        <text x="225" y="21" text-anchor="middle" fill="#88f4ea" font-size="11">C</text>
        <text x="267" y="21" text-anchor="middle" fill="#c8bfff" font-size="11">M</text>
      </g>

      <path d="M366 222 V260" stroke="#43d9d1" stroke-width="2"/>
      <path d="M360 253 l6 8 6 -8" fill="none" stroke="#43d9d1" stroke-width="2"/>

      <rect x="194" y="265" width="160" height="62" rx="13" fill="#10252c" stroke="#2f7f7b"/>
      <text x="274" y="291" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Audio decoder</text>
      <text x="274" y="311" text-anchor="middle" fill="#809aab" font-size="11">Higgs Audio V2</text>

      <path d="M358 296 H395" stroke="#43d9d1" stroke-width="2"/>
      <path d="M388 290 l8 6 -8 6" fill="none" stroke="#43d9d1" stroke-width="2"/>

      <rect x="398" y="265" width="140" height="62" rx="13" fill="#10232e" stroke="#397383"/>
      <text x="468" y="291" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Waveform</text>
      <text x="468" y="311" text-anchor="middle" fill="#809aab" font-size="11">post-process</text>

      <g transform="translate(194 355)">
        <path d="M0 24 H18 L29 7 L42 42 L56 12 L70 34 L84 18 L99 28 L112 5 L128 43 L143 17 L159 31 L175 13 L190 37 L207 21 L224 27 L240 10 L255 38 L270 23 L288 24 H344"
