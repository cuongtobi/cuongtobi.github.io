    <text x="0" y="78" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="72" font-weight="850" letter-spacing="-3">Omni</text>
    <text x="165" y="78" fill="url(#cyan)" font-family="Inter,Segoe UI,sans-serif" font-size="72" font-weight="850" letter-spacing="-3">Voice</text>
    <text x="0" y="128" fill="#d7e2ec" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="650">Zero-shot TTS cho hơn 600 ngôn ngữ</text>
    <text x="0" y="167" fill="#879bad" font-family="Inter,Segoe UI,sans-serif" font-size="17">Voice cloning · Voice design · Diffusion-style decoding</text>

    <g transform="translate(0 224)">
      <rect width="420" height="247" rx="20" fill="#091823" stroke="#2a4557"/>
      <text x="24" y="39" fill="#8ddff0" font-family="JetBrains Mono,monospace" font-size="14">INPUT MODES</text>
      <rect x="24" y="61" width="372" height="46" rx="10" fill="#102532" stroke="#226c76"/>
      <text x="43" y="90" fill="#66e4d6" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">AUTO VOICE</text>
      <text x="174" y="90" fill="#8fa3b4" font-family="Inter,Segoe UI,sans-serif" font-size="13">text only</text>

      <rect x="24" y="117" width="372" height="46" rx="10" fill="#151d37" stroke="#514f94"/>
      <text x="43" y="146" fill="#b4a8ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">VOICE CLONING</text>
      <text x="192" y="146" fill="#8fa3b4" font-family="Inter,Segoe UI,sans-serif" font-size="13">text + reference audio</text>

      <rect x="24" y="173" width="372" height="46" rx="10" fill="#24192d" stroke="#76508d"/>
      <text x="43" y="202" fill="#d9a5f2" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">VOICE DESIGN</text>
      <text x="180" y="202" fill="#8fa3b4" font-family="Inter,Segoe UI,sans-serif" font-size="13">text + instruct</text>
