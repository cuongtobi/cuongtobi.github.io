        <rect x="42" width="31" height="31" rx="6" fill="#216c75"/>
        <rect x="84" width="31" height="31" rx="6" fill="#3c326e"/>
        <rect x="126" width="31" height="31" rx="6" fill="#216c75"/>
        <rect x="168" width="31" height="31" rx="6" fill="#3c326e"/>
