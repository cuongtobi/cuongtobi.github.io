<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OmniVoice — 600+ language zero-shot TTS</title>
  <desc id="desc">Cover mô tả flow text, reference voice, masked diffusion audio tokens và waveform output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131d"/>
      <stop offset=".55" stop-color="#0b2130"/>
      <stop offset="1" stop-color="#15112d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="260" fill="#38bdf8" opacity=".08"/>
  <circle cx="140" cy="610" r="280" fill="#7c3aed" opacity=".1"/>

  <g transform="translate(64 70)">
