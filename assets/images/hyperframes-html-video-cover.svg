<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HyperFrames — HTML in. Video out.</title>
  <desc id="desc">Ảnh bìa minh họa pipeline HTML, timeline, Chrome frame capture và FFmpeg render video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f1"/>
      <stop offset="0.58" stop-color="#eeede7"/>
      <stop offset="1" stop-color="#e6e4dd"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 116H1200M0 232H1200M0 348H1200M0 464H1200M172 0V630M344 0V630M516 0V630M688 0V630M860 0V630M1032 0V630" stroke="#d9d7d0" stroke-width="1" opacity=".55"/>

  <g transform="translate(70 64)">
    <text x="0" y="0" fill="#7b7a75" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">CUONG VUONG · AI PROJECTS</text>

    <text x="0" y="92" fill="#0a0a0a" font-family="Inter,Segoe UI,sans-serif" font-size="76" font-weight="800" letter-spacing="-4">HyperFrames</text>
    <text x="0" y="137" fill="#55544f" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="600">HTML in. Video out.</text>
    <text x="0" y="177" fill="#84827b" font-family="IBM Plex Mono,monospace" font-size="15">seekable animation → exact frames → deterministic render</text>

    <g transform="translate(0 230)" filter="url(#shadow)">
      <rect width="470" height="247" rx="18" fill="#ffffff" stroke="#d2d0c9"/>
      <rect width="470" height="42" rx="18" fill="#f2f1ed"/>
      <path d="M0 42H470" stroke="#dad8d1"/>
      <circle cx="23" cy="21" r="5" fill="#b7b4ab"/>
      <circle cx="41" cy="21" r="5" fill="#c9c6bd"/>
      <circle cx="59" cy="21" r="5" fill="#d5d2ca"/>
      <text x="86" y="27" fill="#77746d" font-family="IBM Plex Mono,monospace" font-size="12">index.html</text>

      <text x="26" y="79" fill="#7c3aed" font-family="IBM Plex Mono,monospace" font-size="14">&lt;div</text>
      <text x="78" y="79" fill="#55544f" font-family="IBM Plex Mono,monospace" font-size="14">data-composition-id=</text>
      <text x="253" y="79" fill="#16803a" font-family="IBM Plex Mono,monospace" font-size="14">"launch"</text>
      <text x="318" y="79" fill="#7c3aed" font-family="IBM Plex Mono,monospace" font-size="14">&gt;</text>

      <text x="42" y="112" fill="#7c3aed" font-family="IBM Plex Mono,monospace" font-size="14">&lt;h1</text>
      <text x="86" y="112" fill="#55544f" font-family="IBM Plex Mono,monospace" font-size="14">class=</text>
      <text x="138" y="112" fill="#16803a" font-family="IBM Plex Mono,monospace" font-size="14">"clip"</text>
      <text x="42" y="139" fill="#55544f" font-family="IBM Plex Mono,monospace" font-size="14">data-start=</text>
      <text x="139" y="139" fill="#b56a08" font-family="IBM Plex Mono,monospace" font-size="14">"1"</text>
      <text x="173" y="139" fill="#55544f" font-family="IBM Plex Mono,monospace" font-size="14">data-duration=</text>
      <text x="293" y="139" fill="#b56a08" font-family="IBM Plex Mono,monospace" font-size="14">"4"</text>
      <text x="42" y="166" fill="#7c3aed" font-family="IBM Plex Mono,monospace" font-size="14">&gt;</text>
      <text x="57" y="166" fill="#0a0a0a" font-family="IBM Plex Mono,monospace" font-size="14">Launch day</text>
      <text x="149" y="166" fill="#7c3aed" font-family="IBM Plex Mono,monospace" font-size="14">&lt;/h1&gt;</text>
      <text x="26" y="199" fill="#7c3aed" font-family="IBM Plex Mono,monospace" font-size="14">&lt;/div&gt;</text>

      <rect x="26" y="215" width="418" height="10" rx="5" fill="#ebe9e2"/>
      <rect x="109" y="215" width="244" height="10" rx="5" fill="#0a0a0a"/>
      <circle cx="109" cy="220" r="8" fill="#2563eb"/>
      <circle cx="353" cy="220" r="8" fill="#2563eb"/>
    </g>
  </g>

  <g transform="translate(610 108)">
    <rect width="520" height="416" rx="24" fill="url(#ink)" filter="url(#shadow)"/>
    <text x="34" y="48" fill="#f6f5f1" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">FRAME RENDER PIPELINE</text>
    <text x="34" y="73" fill="#9d9d98" font-family="IBM Plex Mono,monospace" font-size="12">1920×1080 · 30 fps · 6.0s</text>

    <g transform="translate(34 105)" font-family="Inter,Segoe UI,sans-serif">
      <rect width="452" height="64" rx="12" fill="#171717" stroke="#424242"/>
      <text x="24" y="27" fill="#ffffff" font-size="17" font-weight="700">01 · Browser composition</text>
      <text x="24" y="48" fill="#9a9a95" font-size="12">HTML · CSS · media · GSAP / Lottie / Three.js</text>

      <path d="M226 69V91" stroke="#7a7a76" stroke-width="2"/>
      <path d="M220 85L226 92L232 85" fill="none" stroke="#7a7a76" stroke-width="2"/>

      <g transform="translate(0 98)">
        <rect width="452" height="64" rx="12" fill="#171717" stroke="#424242"/>
        <text x="24" y="27" fill="#ffffff" font-size="17" font-weight="700">02 · Seek exact timestamp</text>
        <text x="24" y="48" fill="#9a9a95" font-size="12">frame 150 → 5.000s</text>
      </g>

      <path d="M226 167V189" stroke="#7a7a76" stroke-width="2"/>
      <path d="M220 183L226 190L232 183" fill="none" stroke="#7a7a76" stroke-width="2"/>

      <g transform="translate(0 196)">
        <rect width="452" height="64" rx="12" fill="#171717" stroke="#424242"/>
        <text x="24" y="27" fill="#ffffff" font-size="17" font-weight="700">03 · Chrome frame capture</text>
        <text x="24" y="48" fill="#9a9a95" font-size="12">Puppeteer · CDP · BeginFrame</text>
      </g>

      <path d="M226 265V287" stroke="#7a7a76" stroke-width="2"/>
      <path d="M220 281L226 288L232 281" fill="none" stroke="#7a7a76" stroke-width="2"/>

      <g transform="translate(0 294)">
        <rect width="452" height="64" rx="12" fill="#f6f5f1" stroke="#f6f5f1"/>
        <text x="24" y="27" fill="#0a0a0a" font-size="17" font-weight="800">04 · FFmpeg → final.mp4</text>
        <text x="24" y="48" fill="#66645f" font-size="12">encode · audio mix · output</text>
      </g>
    </g>
  </g>

  <g transform="translate(70 570)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="114" height="30" rx="15" fill="#ffffff" stroke="#cac8c0"/>
    <text x="57" y="20" text-anchor="middle" fill="#3f3e3a" font-size="12" font-weight="700">OPEN SOURCE</text>
    <rect x="126" width="116" height="30" rx="15" fill="#ffffff" stroke="#cac8c0"/>
    <text x="184" y="20" text-anchor="middle" fill="#3f3e3a" font-size="12" font-weight="700">APACHE 2.0</text>
    <rect x="254" width="108" height="30" rx="15" fill="#ffffff" stroke="#cac8c0"/>
    <text x="308" y="20" text-anchor="middle" fill="#3f3e3a" font-size="12" font-weight="700">NODE 22+</text>
    <rect x="374" width="104" height="30" rx="15" fill="#ffffff" stroke="#cac8c0"/>
    <text x="426" y="20" text-anchor="middle" fill="#3f3e3a" font-size="12" font-weight="700">FFMPEG</text>
  </g>

  <text x="1130" y="594" text-anchor="end" fill="#77756f" font-family="IBM Plex Mono,monospace" font-size="13">24 · 09 · 2026</text>
</svg>